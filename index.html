<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cashiea — POS billing, customer tracking & AI automation for India's small shops. Voice invoicing, WhatsApp reports, daily closing summaries. Built for Tier 2/3 cities." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161310" />
    <!-- Canonical origin is the live Vercel deployment until a custom domain
         is verified. PageMetaSync keeps per-route tags in sync client-side. -->
    <link rel="canonical" href="https://cashiea.vercel.app/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="Cashiea" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cashiea — Your Retail Business, Automated" />
    <meta property="og:description" content="POS billing, customer tracking & AI automation for India's small shops. Voice invoicing, WhatsApp reports, daily closing summaries. Built for Tier 2/3 cities." />
    <meta property="og:url" content="https://cashiea.vercel.app/" />
    <meta property="og:image" content="https://cashiea.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cashiea — Your Retail Business, Automated" />
    <meta name="twitter:description" content="POS billing, customer tracking & AI automation for India's small shops. Voice invoicing, WhatsApp reports, daily closing summaries. Built for Tier 2/3 cities." />
    <meta name="twitter:image" content="https://cashiea.vercel.app/og-image.png" />
    <title>Cashiea — Your Retail Business, Automated</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Cashiea",
      "url": "https://cashiea.vercel.app/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "POS billing, customer tracking & AI automation for India's small shops. Voice invoicing, WhatsApp reports, daily closing summaries. Built for Tier 2/3 cities.",
      "offers": {
        "@type": "Offer",
        "price": "7500",
        "priceCurrency": "INR",
        "description": "Monthly plan after the 14-day free trial. No card required, cancel anytime."
      },
      "featureList": [
        "Counter POS with split payments and barcode scanning",
        "Rule-46 GST tax invoices with HSN and CGST/SGST/IGST split",
        "Khata (udhaar) tracking with WhatsApp payment reminders",
        "Stock management with low-stock alerts and CSV import",
        "Customer history, segments and dormant-regular detection",
        "Daily WhatsApp sales reports",
        "Meraj AI assistant with voice in 10 Indian languages",
        "Offline billing with automatic sync",
        "AI reports with PDF and Excel export"
      ]
    }
    </script>

    <script>
      // No-flash theme bootstrap — must run before React paints.
      (function () {
        try {
          var k = 'cashiea-theme';
          var s = localStorage.getItem(k);
          var t = (s === 'light' || s === 'dark')
            ? s
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
