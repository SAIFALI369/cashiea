<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cashiea — POS billing, customer tracking & AI automation for India's small shops. Voice invoicing, WhatsApp reports, daily closing summaries. Built for Tier 2/3 cities." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161310" />
    <title>Cashiea — Your Retail Business, Automated</title>
    <!-- No-flash theme bootstrap. External file (not inline) so production
         can enforce a strict `script-src 'self'` CSP — see vercel.json and
         public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; padding: 24px; text-align: center; color: #1f2937; background: #f7f2e9;">
        <div>
          <h1 style="font-size: 20px; margin-bottom: 8px;">Cashiea needs JavaScript</h1>
          <p style="max-width: 46ch; line-height: 1.5; color: #4b5563;">
            Cashiea is a web app — enable JavaScript in your browser and reload.
            Your data is safe: nothing is stored or synced until the app can run.
          </p>
        </div>
      </noscript>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
