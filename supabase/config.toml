# Supabase project configuration
project_id = "oxlwbxkifyrhggrsaoin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Functions verify JWT by default. Override per-function below (verify_jwt = false)
# for webhooks / OAuth callbacks that must be callable without a user JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.track]
verify_jwt = false

[functions.google-oauth]
verify_jwt = false

[functions.quickbooks-oauth]
verify_jwt = false

[functions.daily-brain]
verify_jwt = false

[functions.daily-reports]
verify_jwt = false

[functions.invoice-reminders]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.canva-oauth]
verify_jwt = false
