name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ALL edge functions
        run: |
          set -e
          echo "Deploying all functions..."
          supabase functions deploy ai-automation
          echo "  ✅ ai-automation"
          supabase functions deploy ai-assistant
          echo "  ✅ ai-assistant"
          supabase functions deploy business-brain
          echo "  ✅ business-brain"
          supabase functions deploy daily-brain
          echo "  ✅ daily-brain"
          supabase functions deploy quick-tasks
          echo "  ✅ quick-tasks"
          supabase functions deploy google-oauth
          echo "  ✅ google-oauth"
          supabase functions deploy google-fetch
          echo "  ✅ google-fetch"
          supabase functions deploy integrations-api
          echo "  ✅ integrations-api"
          supabase functions deploy support-email
          echo "  ✅ support-email"
          supabase functions deploy campaign-send
          echo "  ✅ campaign-send"
          supabase functions deploy track
          echo "  ✅ track"
          supabase functions deploy api-generate-invoice
          echo "  ✅ api-generate-invoice"
          supabase functions deploy api-draft-email
          echo "  ✅ api-draft-email"
          supabase functions deploy create-checkout
          echo "  ✅ create-checkout"
          supabase functions deploy stripe-webhook
          echo "  ✅ stripe-webhook"
          supabase functions deploy daily-reports
          echo "  ✅ daily-reports"
          supabase functions deploy invoice-reminders
          echo "  ✅ invoice-reminders"
          supabase functions deploy quickbooks-oauth
          echo "  ✅ quickbooks-oauth"
          supabase functions deploy whatsapp-webhook
          echo "  ✅ whatsapp-webhook"
          supabase functions deploy whatsapp-send
          echo "  ✅ whatsapp-send"
          supabase functions deploy canva-oauth
          echo "  ✅ canva-oauth"
          echo ""
          echo "🎉 ALL 20 FUNCTIONS DEPLOYED!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Supabase secrets
        run: |
          # SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are
          # auto-injected by Supabase for every edge function — do not set them
          # (the new API rejects secrets with the SUPABASE_ prefix).
          supabase secrets set DEFAULT_GEMINI_API_KEY='${{ secrets.DEFAULT_GEMINI_API_KEY }}'
          echo "✅ Secrets set"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
