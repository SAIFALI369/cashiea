name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: |
          set -e
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            if [ "$fn" != "_shared" ]; then
              echo "::group::Deploying $fn"
              supabase functions deploy "$fn" --no-verify-jwt
              echo "::endgroup::"
            fi
          done
          echo "All functions deployed!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set AI secrets
        run: |
          echo "Setting DEFAULT_GEMINI_API_KEY..."
          echo '${{ secrets.DEFAULT_GEMINI_API_KEY }}' | supabase secrets set DEFAULT_GEMINI_API_KEY=$(cat)
          echo "Setting SUPABASE_URL..."
          supabase secrets set SUPABASE_URL=https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          echo "Setting SUPABASE_ANON_KEY..."
          echo '${{ secrets.SUPABASE_ANON_KEY }}' | supabase secrets set SUPABASE_ANON_KEY=$(cat)
          echo "Setting SUPABASE_SERVICE_ROLE_KEY..."
          echo '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' | supabase secrets set SUPABASE_SERVICE_ROLE_KEY=$(cat)
          echo "All secrets set!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
