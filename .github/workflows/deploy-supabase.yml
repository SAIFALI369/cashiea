name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ALL edge functions
        run: |
          # Deploy every function with a per-function retry, so a transient
          # esm.sh 522 (CDN hiccup fetching @supabase/supabase-js) self-heals
          # instead of aborting the whole deploy.
          set +e
          FAILED=0
          deploy_fn () {
            for attempt in 1 2 3; do
              if supabase functions deploy "$1"; then echo "  ✅ $1"; return 0; fi
              echo "  ⚠️ $1 attempt $attempt failed (often transient esm.sh 522); retrying in 25s..."
              sleep 25
            done
            echo "  ❌ $1 failed after 3 attempts"
            FAILED=1
          }
          for f in ai-automation ai-assistant business-brain daily-brain quick-tasks google-oauth google-fetch integrations-api support-email campaign-send track api-generate-invoice api-draft-email create-checkout stripe-webhook daily-reports invoice-reminders quickbooks-oauth whatsapp-webhook whatsapp-send canva-oauth request-action scan-receipt; do
            deploy_fn "$f"
          done
          echo ""
          if [ "$FAILED" = "1" ]; then echo "⚠️ Some functions failed — re-run the workflow."; exit 1; fi
          echo "🎉 ALL FUNCTIONS DEPLOYED!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Supabase secrets
        run: |
          # SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are
          # auto-injected by Supabase for every edge function — do not set them
          # (the new API rejects secrets with the SUPABASE_ prefix).
          supabase secrets set DEFAULT_GEMINI_API_KEY='${{ secrets.DEFAULT_GEMINI_API_KEY }}'
          echo "✅ Secrets set"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
